# ============================================================
#  Настройки сайта. Правьте этот файл, а не HTML-страницы.
# ============================================================

title: Домашние задания
description: Домашние задания и учебные материалы
lang: ru

# Базовый путь. ОБЯЗАТЕЛЕН для сайта-проекта на github.io:
# адрес сайта будет https://integrate.github.io/home_work_cdz/
# Без этой строки вёрстка «поедет» (не найдутся стили).
baseurl: "/home_work_cdz"

# Обёртка по умолчанию для всех страниц сайта.
# Благодаря этому ученические .md не нуждаются во front matter —
# пишете чистый Markdown, Jekyll сам навешивает оформление.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Служебные файлы не должны попасть на сайт.
#
# Про readme: сравнение в exclude регистрозависимое, а Windows
# регистр не различает — поэтому указаны ОБЕ версии имени.
# Это важно: плагин jekyll-readme-index включён на GitHub Pages
# по умолчанию и без exclude он отдал бы readme по адресу / ,
# затёрв главную страницу index.md.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .git
  - .gitignore
  - node_modules

# ------------------------------------------------------------
#  ВАЖНО про ссылки между страницами
# ------------------------------------------------------------
#  На GitHub Pages по умолчанию включён плагин jekyll-relative-links:
#  он сам превращает ссылку (01-zadacha.md) в (01-zadacha.html).
#
#  Поэтому в .md пишем ссылки на .md — так они работают и в исходнике
#  на GitHub, и на собранном сайте.
#
#  Ограничение: работают ТОЛЬКО инлайновые ссылки
#      [Текст](файл.md)      — да
#      [Текст][метка]        — нет, будет битая ссылка
#
#  Ссылка на вложенную папку пишется на её index.md:
#      [Раздел](02-cikly/index.md)
# ------------------------------------------------------------
